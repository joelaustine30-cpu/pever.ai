
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pevere AI</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10121b;
            color: white;
            display: grid;
            place-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        h1 {
            color: #8b9cff;
        }

        .chat {
            background: #1c2030;
            padding: 25px;
            border-radius: 15px;
        }

        input {
            width: 75%;
            padding: 14px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 14px;
            background: #687cff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #messages {
            min-height: 150px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Personal AI</h1>
    <p>Your personal assistant is coming alive.</p>

    <div class="chat">
        <div id="messages">
            <p>AI: Hello! How can I help you today?</p>
        </div>

        <input id="userInput" placeholder="Ask me anything...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById("userInput");
        const messages = document.getElementById("messages");

        if (input.value.trim() === "") return;

        const message = document.createElement("p");
        message.textContent = "You: " + input.value;

        messages.appendChild(message);
        input.value = "";
    }
</script>

</body>
</html>
