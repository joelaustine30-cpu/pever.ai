
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA | Pever AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080d19;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 750px;
    text-align: center;
}

.logo {
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 8px;
    color: #65aaff;
    text-shadow: 0 0 25px #176cff;
}

.subtitle {
    color: #91a4c5;
    letter-spacing: 2px;
    font-size: 12px;
}

.chat {
    margin-top: 35px;
    background: #111a2b;
    border: 1px solid #263c60;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 0 35px #10264b;
}

.status {
    color: #57e6b0;
    font-size: 13px;
    margin-bottom: 20px;
}

#messages {
    min-height: 180px;
    max-height: 350px;
    overflow-y: auto;
    text-align: left;
}

.message {
    background: #1a2941;
    padding: 13px;
    border-radius: 10px;
    margin: 10px 0;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #344e78;
    background: #080d19;
    color: white;
    outline: none;
}

button {
    padding: 14px 20px;
    border: none;
    border-radius: 9px;
    background: #287aff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #4b91ff;
}

footer {
    margin-top: 25px;
    color: #667b9e;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">PEVER</div>

    <p class="subtitle">
        YOUR PERSONAL INTELLIGENCE ASSISTANT
    </p>

    <div class="chat">

        <div class="status">
            ● PEVER INTERFACE ONLINE
        </div>

        <div id="messages">
            <div class="message">
                <strong>PEVER:</strong>
                Greetings. I am PEVER, your personal
                digital assistant. How may I assist you today?
            </div>
        </div>

        <div class="input-area">
            <input
                id="userInput"
                type="text"
                placeholder="Talk to NOVA..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

    </div>

    <footer>
        PEVER AI SYSTEMS | VERSION 1.0
    </footer>

</div>

<script>
function sendMessage() {

    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (!text) return;

    const message = document.createElement("div");
    message.className = "message";

    const label = document.createElement("strong");
    label.textContent = "YOU: ";

    message.appendChild(label);
    message.appendChild(document.createTextNode(text));

    messages.appendChild(message);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
}

document.getElementById("userInput")
.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
